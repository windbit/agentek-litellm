name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: [self-hosted, agentek]
    permissions:
      contents: write # Required so Claude can commit conflict resolutions and push to the PR branch
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so Claude can merge/rebase the base branch and resolve conflicts
          # No submodules: GITHUB_TOKEN can't clone the private core/hermes/openclaw repos,
          # and gitlink (submodule-pointer) conflicts resolve at the SHA level without their contents.

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # git/gh + build-tools allow Claude to merge the base branch, resolve conflicts, verify and push.
          # Resolve a PR's conflicts by commenting: @claude resolve the merge conflicts in this PR
          # --append-system-prompt bakes in the review-fix protocol so a plain
          # "@claude исправь замечания по ревью" triggers the full flow without re-typing it.
          claude_args: >-
            --allowed-tools "Bash(git:*),Bash(gh:*),Bash(pytest:*),Bash(python:*),Edit,Write,Read,Glob,Grep"
            --append-system-prompt "Протокол работы с замечаниями ревью. Когда тебя просят исправить замечания по ревью в PR: 1) внеси правки и запушь их в ветку PR; 2) в каждом треде ревьювера ответь комментарием, что именно исправил и в каком коммите; 3) если фикс очевидный и ревьюверу не нужно перепроверять твоё решение — сам резолвни тред через GitHub GraphQL (resolveReviewThread); 4) когда все треды ревью резолвнуты — сними request changes (dismiss review через gh api); 5) если правка неочевидная или спорная — НЕ резолвь тред и не снимай request changes, оставь ревьюверу на перепроверку, чётко описав, что сделал. Отвечай в треды и пиши коммиты на русском."

