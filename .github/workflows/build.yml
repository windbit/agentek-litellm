# Builds ghcr.io/windbit/agentek-litellm from this fork's Dockerfile (admin UI is
# built here, not committed). Mirrors agentek-hermes: PRs build to validate, push
# to master publishes :sha and :latest for the helm-litellm image.tag bump.
name: build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # PR из форков наш раннер не обслуживает.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, agentek]
    steps:
      - uses: actions/checkout@v6


      # PRs validate the build (Dockerfile, dep install, admin UI build) without publishing.
      - uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/windbit/agentek-litellm:${{ github.sha }}
          provenance: false

      - uses: docker/build-push-action@v7
        if: github.event_name == 'push'
        with:
          context: .
          platforms: linux/amd64
          push: true
          # :latest — только с master, даже если в триггер добавят ещё ветку.
          tags: |
            ghcr.io/windbit/agentek-litellm:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/windbit/agentek-litellm:latest' || '' }}
          provenance: false
