# Builds ghcr.io/windbit/agentek-litellm from this fork's Dockerfile (admin UI is
# built here, not committed). Mirrors agentek-hermes: PRs build to validate, push
# to master publishes :sha and :latest for the helm-litellm image.tag bump.
name: build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Форк-PR не пускаем на self-hosted раннер: там docker, то есть root на хосте.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, agentek]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs validate the build (Dockerfile, dep install, admin UI build) without publishing.
      - uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/windbit/agentek-litellm:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v7
        if: github.event_name == 'push'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/windbit/agentek-litellm:latest
            ghcr.io/windbit/agentek-litellm:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
