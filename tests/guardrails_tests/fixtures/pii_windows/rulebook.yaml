version: "2"
groups:
  - name: personal_data
    rules:
      - rule_id: pii.inn.person
        entity: RU_INN
        regex: '\b\d{12}\b'
        validator: inn
      - rule_id: pii.inn.org
        entity: RU_INN
        regex: '\b\d{10}\b'
        validator: inn
      - rule_id: pii.snils.dashed
        entity: RU_SNILS
        regex: '\b\d{3}-\d{3}-\d{3}[ -]\d{2}\b'
        validator: snils
      - rule_id: pii.snils.plain
        entity: RU_SNILS
        regex: '\b\d{11}\b'
        validator: snils
      - rule_id: pii.ogrn.org
        entity: RU_OGRN
        regex: '\b\d{13}\b'
        validator: ogrn
      - rule_id: pii.ogrn.ip
        entity: RU_OGRN
        regex: '\b\d{15}\b'
        validator: ogrn
      # КПП контрольной суммы не имеет — точность держится на слове рядом.
      - rule_id: pii.kpp
        entity: RU_KPP
        regex: '(?i)\bкпп\b[\s:№]*(\d{9})\b'
        capture_group: 1
      # Паспорт тоже без контрольной суммы: серия и номер — просто десять цифр.
      - rule_id: pii.passport.context
        entity: RU_PASSPORT
        regex: '(?i)\b(?:паспорт|серия)\b[\s:№]*(\d{2}\s?\d{2}\s?\d{6})\b'
        capture_group: 1
      # Международный номер: встроенный PHONE_NUMBER Presidio снят — он давал 0.4 и телефону,
      # и любому голому числу, поэтому порогом не разводился. Плюс с длинной цифр — форма,
      # которую почти нечем спутать, а без плюса номер заказа снова стал бы телефоном.
      - rule_id: pii.phone.intl
        entity: RU_PHONE_NUMBER
        regex: '\+\d[\d\s\-()]{7,18}\d'
        score: 0.7
      - rule_id: pii.phone.ru
        entity: RU_PHONE_NUMBER
        regex: '(?:\+?7|\b8)[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}\b'
        score: 0.75
      # Мобильный без кода страны: те же десять цифр, что у ИНН организации, и каждый
      # одиннадцатый номер проходит его контрольную сумму. Score выше валидированного —
      # иначе один и тот же формат номера попадает то под RU_INN, то никуда.
      - rule_id: pii.phone.ru.bare
        entity: RU_PHONE_NUMBER
        regex: '\b9\d{9}\b'
        score: 0.96
      # Домен разбираем по меткам, а не жадным [\w.]: иначе точка в конце предложения
      # уезжает внутрь адреса и восстановленное значение отличается от исходного.
      - rule_id: pii.email
        entity: EMAIL_ADDRESS
        regex: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
        score: 0.9
      - rule_id: pii.card
        entity: CREDIT_CARD
        regex: '\b\d(?:[ -]?\d){12,18}\b'
        validator: luhn
      - rule_id: pii.iban
        entity: IBAN_CODE
        regex: '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'
        validator: iban
  - name: names
    rules:
      # Отчество как якорь точности: падежи, дефисные фамилии, капс.
      # Капс анализатор на русском не находит вовсе — это правило закрывает его пробел.
      - rule_id: pii.fio-ru
        entity: PERSON
        regex: '(?:^|[^ЁА-Яёа-я])((?:[ЁА-Я][ёа-я]+(?:-[ЁА-Я][ёа-я]+)?\s+[ЁА-Я][ёа-я]+\s+[ЁА-Я][ёа-я]+(?:ич(?:а|у|ем|е)?|вн(?:а|ы|е|у|ой)|ичн(?:а|ы|е|у|ой)))|(?:[ЁА-Я][ёа-я]+\s+[ЁА-Я][ёа-я]+(?:ич(?:а|у|ем|е)?|вн(?:а|ы|е|у|ой)|ичн(?:а|ы|е|у|ой))\s+[ЁА-Я][ёа-я]+(?:-[ЁА-Я][ёа-я]+)?)|(?:[ЁА-Я]{2,}(?:-[ЁА-Я]{2,})?\s+[ЁА-Я]{2,}\s+[ЁА-Я]+(?:ИЧ(?:А|У|ЕМ|Е)?|ВН(?:А|Ы|Е|У|ОЙ)|ИЧН(?:А|Ы|Е|У|ОЙ)))|(?:[ЁА-Я]{2,}\s+[ЁА-Я]+(?:ИЧ(?:А|У|ЕМ|Е)?|ВН(?:А|Ы|Е|У|ОЙ)|ИЧН(?:А|Ы|Е|У|ОЙ))\s+[ЁА-Я]{2,}(?:-[ЁА-Я]{2,})?))(?:[^ЁА-Яёа-я]|$)'
        capture_group: 1
        score: 0.9
      # Фамилия с дотированными инициалами; одиночная буква с точкой не совпадает.
      - rule_id: pii.fio-ru.initials
        entity: PERSON
        regex: '(?:^|[^ЁА-Яёа-я])((?:[ЁА-Я][ёа-я]+(?:-[ЁА-Я][ёа-я]+)?\s+[ЁА-Я]\.\s?[ЁА-Я]\.)|(?:[ЁА-Я]\.\s?[ЁА-Я]\.\s*[ЁА-Я][ёа-я]+(?:-[ЁА-Я][ёа-я]+)?)|(?:[ЁА-Я]{2,}(?:-[ЁА-Я]{2,})?\s+[ЁА-Я]\.\s?[ЁА-Я]\.)|(?:[ЁА-Я]\.\s?[ЁА-Я]\.\s*[ЁА-Я]{2,}(?:-[ЁА-Я]{2,})?))(?:[^ЁА-Яёа-я.]|$)'
        capture_group: 1
        score: 0.9
      # Пара имя-фамилия по словарю имён. Recall-смещённое правило, поэтому отдельным rule_id:
      # если словарь начнёт мешать, его можно снять, не трогая остальные.
      - rule_id: pii.fio-ru.short
        entity: PERSON
        regex: '(?:^|[^ЁА-Яёа-я])((?:(?:(?:(?:Александр|Анастаси|Валентин|Екатерин|Елизавет|Маргарит|Алевтин|Ангелин|Антонин|Вероник|Виктори|Кристин|Светлан|Валери|Варвар|Евгени|Зинаид|Клавди|Людмил|Надежд|Натали|Наталь|Татьян|Анжел|Галин|Карин|Ксени|Ларис|Марин|Милан|Оксан|Полин|Регин|Таиси|Тамар|Ульян|Ален|Алин|Алис|Алён|Дарь|Диан|Елен|Жанн|Ирин|Лиди|Лили|Мари|Марь|Олес|Ольг|Раис|Софи|Софь|Алл|Анн|Вер|Дин|Инн|Кир|Нин|Юли|Ев|Зо|Ян)(?:а|я|ы|е|у|ю|ой|ей))|(?:(?:Константин|Александр|Владислав|Станислав|Анатолий|Валентин|Владимир|Всеволод|Вячеслав|Геннадий|Григорий|Алексей|Аркадий|Арсений|Валерий|Василий|Виталий|Георгий|Дмитрий|Евгений|Николай|Савелий|Тимофей|Ярослав|Андрей|Богдан|Виктор|Герман|Даниил|Данила|Кирилл|Леонид|Максим|Матвей|Михаил|Никита|Руслан|Сергей|Степан|Эдуард|Антон|Артем|Артём|Борис|Вадим|Данил|Денис|Игорь|Макар|Марат|Мирон|Павел|Роман|Семен|Семён|Тимур|Федор|Фёдор|Глеб|Егор|Иван|Илья|Марк|Олег|Петр|Пётр|Юрий|Лев)(?:а|у|ом|ем|е|ой|я|ю|й)?)|(?:Любовь))\s+[ЁА-Я][ёа-я]+(?:-[ЁА-Я][ёа-я]+)?)|(?:[ЁА-Я][ёа-я]+(?:ов|ев|ёв|ин|ын|ск|цк|енк|ук|юк|ич|шин|нко|ая|яя|ой|ый|ий|ых|их)[ёа-я]{0,3}\s+(?:(?:(?:Александр|Анастаси|Валентин|Екатерин|Елизавет|Маргарит|Алевтин|Ангелин|Антонин|Вероник|Виктори|Кристин|Светлан|Валери|Варвар|Евгени|Зинаид|Клавди|Людмил|Надежд|Натали|Наталь|Татьян|Анжел|Галин|Карин|Ксени|Ларис|Марин|Милан|Оксан|Полин|Регин|Таиси|Тамар|Ульян|Ален|Алин|Алис|Алён|Дарь|Диан|Елен|Жанн|Ирин|Лиди|Лили|Мари|Марь|Олес|Ольг|Раис|Софи|Софь|Алл|Анн|Вер|Дин|Инн|Кир|Нин|Юли|Ев|Зо|Ян)(?:а|я|ы|е|у|ю|ой|ей))|(?:(?:Константин|Александр|Владислав|Станислав|Анатолий|Валентин|Владимир|Всеволод|Вячеслав|Геннадий|Григорий|Алексей|Аркадий|Арсений|Валерий|Василий|Виталий|Георгий|Дмитрий|Евгений|Николай|Савелий|Тимофей|Ярослав|Андрей|Богдан|Виктор|Герман|Даниил|Данила|Кирилл|Леонид|Максим|Матвей|Михаил|Никита|Руслан|Сергей|Степан|Эдуард|Антон|Артем|Артём|Борис|Вадим|Данил|Денис|Игорь|Макар|Марат|Мирон|Павел|Роман|Семен|Семён|Тимур|Федор|Фёдор|Глеб|Егор|Иван|Илья|Марк|Олег|Петр|Пётр|Юрий|Лев)(?:а|у|ом|ем|е|ой|я|ю|й)?)|(?:Любовь))))(?:[^ЁА-Яёа-я]|$)'
        capture_group: 1
        score: 0.9
  - name: network
    rules:
      - rule_id: net.ipv4
        entity: IP_ADDRESS
        regex: '\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'
        score: 0.7
      - rule_id: net.ipv6
        entity: IP_ADDRESS
        regex: '\b(?:[A-Fa-f0-9]{1,4}:){7}[A-Fa-f0-9]{1,4}\b'
        score: 0.7
  - name: secrets
    rules:
      - rule_id: secrets.aws.access-key
        entity: API_KEY
        regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
      - rule_id: secrets.openai
        entity: API_KEY
        regex: '\bsk-[A-Za-z0-9_\-]{20,}\b'
      - rule_id: secrets.github
        entity: API_KEY
        regex: '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
      - rule_id: secrets.slack
        entity: API_KEY
        regex: '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
      - rule_id: secrets.jwt
        entity: ACCESS_TOKEN
        regex: '\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b'
      - rule_id: secrets.private-key-pem
        entity: CREDENTIALS
        regex: '-----BEGIN (?:RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
      - rule_id: secrets.url-with-creds
        entity: CREDENTIALS
        regex: '\b[a-z][a-z0-9+.\-]*://[^\s:/@]+:([^\s/@]+)@'
        capture_group: 1
      - rule_id: secrets.http-basic
        entity: CREDENTIALS
        regex: '(?i)\bauthorization\s*:\s*basic\s+([A-Za-z0-9+/=]{8,})'
        capture_group: 1
      - rule_id: secrets.http-bearer
        entity: ACCESS_TOKEN
        regex: '(?i)\bauthorization\s*:\s*bearer\s+([A-Za-z0-9._\-]{16,})'
        capture_group: 1
